name: gresbase_sdk
description: >-
  Official Dart SDK for Gresbase — admin & record auth with auto-refresh,
  full CRUD with filtering/sorting/expansion, realtime subscriptions over SSE
  (channels, presence, broadcast), file uploads, aggregations, and batch
  operations.
version: 0.4.0
homepage: https://github.com/gresbase/gresbase
repository: https://github.com/gresbase/gresbase

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
