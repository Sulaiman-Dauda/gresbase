# golangci-lint v1 configuration for Gresbase backend.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    # default set
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # explicitly added for a production-grade bar
    - gosec
    - bodyclose
    - misspell
    - unconvert
    - nilerr
    - errorlint
    - rowserrcheck
    - sqlclosecheck

linters-settings:
  errcheck:
    check-type-assertions: true
    # ResponseWriter.Write and connection deadline setters are conventionally
    # unchecked (nothing actionable on failure mid-response).
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*github.com/gorilla/websocket.Conn).SetReadDeadline
      - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
  misspell:
    # "Terminater" is the spelling used by the tus/tusd library API.
    ignore-words:
      - Terminater
  gosec:
    excludes:
      - G104 # handled by errcheck
      - G304 # file-path-from-variable: storage layer is path-sanitized and tested

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files: relax security/error-noise that doesn't matter in tests.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - bodyclose
        - contextcheck
    # SQL identifiers in this codebase are quoted via QuoteIdent; gosec's
    # string-formatted-query heuristic (G201/G202) produces false positives.
    - linters:
        - gosec
      text: 'G20[12]'
