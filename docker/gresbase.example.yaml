# Gresbase configuration example.
# Copy this to gresbase.yaml and customize. Any value here can also be supplied
# as an environment variable (e.g. database_url -> DATABASE_URL); environment
# variables take precedence and are the recommended way to provide secrets.

# ---- Server ----
addr: ":8080"
# Public base URL. Used for email links and as the WebAuthn relying party.
domain: "localhost"
# Trust forwarded client-IP headers only from these proxy CIDRs (set when
# running behind a reverse proxy). Unset = ignore forwarded headers.
# trusted_proxies: "10.0.0.0/8,127.0.0.1/32"

# ---- Database ----
# External PostgreSQL is required for production. Leave database_url empty to
# use the embedded PostgreSQL (development / small single-node only).
database_url: "postgres://gresbase:gresbase@localhost:5432/gresbase?sslmode=disable"
# Optional read replica for replica-safe reads (lists, aggregations, expansion).
# database_replica_url: "postgres://gresbase:gresbase@replica:5432/gresbase?sslmode=require"
database_max_open_conns: 25
database_max_idle_conns: 5
database_max_idle_time: 5m

# ---- Auth ----
jwt_algorithm: "HS256" # HS256 or ES256
jwt_key_id: "gresbase-default"
# A strong, explicit secret is REQUIRED in production (>= 32 chars).
# Generate one with: openssl rand -hex 32
jwt_secret: "change-this-to-a-random-64-char-string-in-production"
# For ES256, omit jwt_secret and provide a PEM key pair instead:
# jwt_private_key: |-
#   -----BEGIN EC PRIVATE KEY-----
#   ...
#   -----END EC PRIVATE KEY-----
# jwt_public_key: |-
#   -----BEGIN PUBLIC KEY-----
#   ...
#   -----END PUBLIC KEY-----
access_token_expiry: 15m
refresh_token_expiry: 168h # 7 days
# Password hash work factor (clamped 10-14).
bcrypt_cost: 10

# ---- HTTP security / CORS ----
# Browser origins allowed to call the API.
# Must be explicit (no wildcard) in production.
cors_allowed_origins:
  - "https://app.example.com"
cors_allow_credentials: true
# Max request body for non-upload routes, in bytes (default 10 MiB).
max_request_body_bytes: 10485760

# ---- TLS ----
# Prefer terminating TLS at a reverse proxy. To serve HTTPS directly, set
# enable_tls and point at your own certificate/key files.
enable_tls: false
# tls_cert_file: "/etc/gresbase/tls/fullchain.pem"
# tls_key_file:  "/etc/gresbase/tls/privkey.pem"

# ---- Storage ----
storage_backend: "local" # local or s3
storage_local_path: "./storage"
# S3 (required when storage_backend is "s3", and for multi-node deployments):
# s3_endpoint: "https://s3.amazonaws.com"
# s3_bucket: "my-bucket"
# s3_region: "us-east-1"
# s3_access_key: ""
# s3_secret_key: ""
# s3_use_ssl: true

# ---- Backups ----
# Scheduled database backups. Leave backup_cron empty to disable.
# backup_cron: "0 2 * * *"   # daily at 02:00
backup_max_keep: 7
backup_upload_s3: false      # mirror snapshots to S3 (requires s3_* settings)

# ---- Email (SMTP) ----
# smtp_host: "smtp.example.com"
# smtp_port: 587
# smtp_username: ""
# smtp_password: ""
# smtp_from: "noreply@example.com"

# ---- Realtime ----
realtime_max_connections: 10000
realtime_idle_timeout: 5m
realtime_max_message_size: 65536
realtime_max_connection_age: 30m
# Fan out record events across app nodes via PostgreSQL LISTEN/NOTIFY.
realtime_multi_node: false
# Capture rows changed by direct SQL via logical replication (needs
# wal_level=logical and a REPLICATION role).
realtime_wal_enabled: false

# ---- Extensibility (file-based JS hooks) ----
# Hooks run UNSANDBOXED in-process — trusted, first-party code only.
# Set hooks_dir to "" to disable.
hooks_dir: "./gb_hooks"
hooks_watch: true
# Collection schema migration files, applied on boot.
migrations_dir: "./gb_migrations"

# ---- Rate limiting ----
rate_limit_enabled: true
rate_limit_rps: 100
rate_limit_burst: 200

# ---- Observability ----
metrics_enabled: true
# Bearer token gating /metrics. Empty leaves it open for trusted networks.
# metrics_token: ""

# ---- Development ----
dev_mode: false
log_level: "info" # debug, info, warn, error
