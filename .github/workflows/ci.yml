name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + lint + vuln)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 1.25.12 or newer: 1.25.11 carries GO-2026-5856, an Encrypted Client
          # Hello privacy leak in crypto/tls that govulncheck finds reachable.
          go-version: '>=1.25.12'
          cache-dependency-path: backend/go.sum

      - name: Add PostgreSQL binaries to PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { echo 'gofmt found issues:'; gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test (race + coverage)
        run: go test ./... -race -count=1 -timeout=300s -coverprofile=coverage.out

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        # Advisory, not blocking — see the tracked issue.
        #
        # The lint step could never actually run before: it pinned golangci-lint
        # v1.64.8, which refuses a `go 1.25` module. Fixing that revealed ~178
        # pre-existing findings (62 errcheck, 91 gosec, 25 staticcheck). That is
        # surfaced debt, not a regression — and gosec findings in particular need
        # judging one at a time rather than silencing in bulk.
        #
        # The linter runs and its output is visible on every PR, but it does not
        # gate merges until the backlog is cleared. Remove continue-on-error then.
        continue-on-error: true
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
